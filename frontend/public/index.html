<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d14">
<title>Eruda Viewer</title>
<style>
:root{color-scheme:dark;--bg:#0b0d14;--panel:#121827;--panel2:#1a2233;--line:#2a3550;--text:#edf0fa;--muted:#8d98b1;--accent:#8878ff;--accent2:#6757e8;--green:#48d6a0}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
header{padding:15px 18px 12px;background:linear-gradient(180deg,#171d2c,#111725);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:750;letter-spacing:.2px}.logo{height:33px;width:33px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#a69aff,#5b4bd0);box-shadow:0 5px 20px #7665ff40}.logo svg{width:19px}.pill{font-size:10px;letter-spacing:.8px;font-weight:750;color:var(--green);border:1px solid #48d6a044;background:#48d6a012;border-radius:20px;padding:5px 8px}
.toolbar{display:flex;gap:8px}.address{height:44px;display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:0 12px;border:1px solid #303b56;border-radius:12px;background:#0b101b}.address svg{color:var(--muted);flex:none}input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit}
button{height:43px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font:600 13px system-ui;white-space:nowrap;cursor:pointer}button:hover{border-color:#7569e6;background:#252543}button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;align-items:center;gap:7px;margin-top:10px}.actions button{height:32px;padding:0 10px;font-size:12px}#status{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
main{flex:1;min-height:0;display:flex}.frame-wrap{position:relative;flex:1;min-height:0;background:#fff}iframe{width:100%;height:100%;border:0;display:block;background:white}.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:radial-gradient(ellipse at 50% 28%,#20254a,#0b0d14 68%)}.empty-inner{text-align:center;padding:24px;max-width:430px}.empty-icon{height:66px;width:66px;margin:0 auto 17px;border-radius:20px;display:grid;place-items:center;border:1px solid #ffffff20;background:#ffffff09;color:#a89dff}.empty h1{font-size:23px;margin:0 0 8px}.empty p{color:var(--muted);margin:0}.hidden{display:none!important}
footer{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-top:1px solid var(--line);background:#111725;color:var(--muted);font-size:11px}
@media(max-width:620px){header{padding:12px 11px 10px}.top{margin-bottom:10px}.toolbar{display:grid;grid-template-columns:1fr auto}.address{grid-column:1/-1;grid-row:1}.toolbar button{grid-row:2}.actions{flex-wrap:wrap}.actions button{flex:0 0 auto}#status{order:5;width:100%;margin:2px 0 0}footer{padding:8px 11px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></span>Eruda Viewer</div>
    <span class="pill">● READY</span>
  </div>
  <form id="nav" class="toolbar">
    <label class="address"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0-20"/></svg><input id="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://authorized-domain.example" aria-label="Website URL"></label>
    <button class="primary" id="load" type="submit">Load page</button>
    <button id="reload" type="button" title="Reload">↻</button>
  </form>
  <div class="actions">
    <button id="back" type="button">← Back</button><button id="forward" type="button">Forward →</button><button id="home" type="button">⌂ Home</button>
    <span id="status" role="status">Proxy connection: checking…</span>
  </div>
</header>
<main><section class="frame-wrap">
  <div class="empty" id="empty"><div class="empty-inner">
    <div class="empty-icon"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></div>
    <h1>Your debugging workspace</h1><p>Enter an authorized website to open it with Eruda DevTools.</p>
  </div></div>
  <iframe id="preview" title="Website preview" sandbox="allow-scripts allow-forms allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe>
</section></main>
<footer><span>ERUDA VIEWER · <span id="year"></span></span><span>Isolated preview session</span></footer>
<script>
(() => {
  const proxyBase = "__PROXY_BASE__".replace(/\/$/,"");
  const form=document.querySelector("#nav"), input=document.querySelector("#url"), frame=document.querySelector("#preview");
  const status=document.querySelector("#status"), empty=document.querySelector("#empty"), load=document.querySelector("#load");
  const stack=[]; let position=-1;
  function makeProxy(raw){
    const u=new URL(raw.includes("://")?raw:"https://"+raw);
    if(!["http:","https:"].includes(u.protocol)||u.username||u.password) throw Error("Enter a valid HTTP(S) URL without credentials.");
    return proxyBase+"/proxy?url="+encodeURIComponent(u.href);
  }
  function navigate(raw,push=true){
    try{
      const normalized=new URL(raw.includes("://")?raw:"https://"+raw).href;
      const target=makeProxy(normalized);
      if(push){stack.splice(position+1);stack.push(normalized);position=stack.length-1;}
      input.value=normalized;empty.classList.add("hidden");load.disabled=true;status.textContent="Loading "+new URL(normalized).hostname+"…";frame.src=target;
    }catch(e){status.textContent=e.message||"Invalid address.";}
  }
  form.addEventListener("submit",e=>{e.preventDefault();navigate(input.value.trim());});
  frame.addEventListener("load",()=>{load.disabled=false;status.textContent="Preview navigation completed. Page errors may still occur.";});
  document.querySelector("#reload").onclick=()=>{if(position>=0)navigate(stack[position],false);};
  document.querySelector("#back").onclick=()=>{if(position>0){position--;navigate(stack[position],false);}};
  document.querySelector("#forward").onclick=()=>{if(position<stack.length-1){position++;navigate(stack[position],false);}};
  document.querySelector("#home").onclick=()=>{frame.removeAttribute("src");input.value="";empty.classList.remove("hidden");load.disabled=false;status.textContent="Ready.";};
  document.querySelector("#year").textContent=new Date().getFullYear();
  fetch(proxyBase+"/health").then(r=>{if(!r.ok)throw Error();return r.json();}).then(()=>status.textContent="Proxy connected · authorized domains only").catch(()=>status.textContent="Proxy unavailable · check backend URL");
})();
</script>
</body>
</html>
